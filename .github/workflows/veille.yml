name: Veille quotidienne FIFA 2026

# Runs every day at 06:30 UTC (~08:30 Paris). Adjust as you like.
on:
  schedule:
    - cron: "30 6 * * *"
  workflow_dispatch:        # lets you trigger it manually from the Actions tab

permissions:
  contents: write
  pull-requests: write

jobs:
  veille:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run RSS monitoring
        run: python scripts/veille.py --days 1 --out drafts

      - name: Open pull request with candidates
        uses: peter-evans/create-pull-request@v6
        with:
          commit-message: "veille: candidats du jour"
          branch: veille/auto-candidates
          delete-branch: true
          title: "🔎 Veille FIFA 2026 — candidats du jour"
          body: |
            Liste automatique des articles RSS correspondant aux critères FIFA 2026.

            **À faire :**
            - [ ] Vérifier chaque source primaire
            - [ ] Cocher les articles pertinents dans le fichier `drafts/`
            - [ ] Générer le JSON pour les retenus (via Claude Code)
            - [ ] Écarter doublons et hors-sujets

            ⚠️ Rien n'est publié automatiquement. Cette PR ne modifie que le dossier `drafts/`.
          add-paths: |
            drafts/**
