<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FIFA 2026 Watch — Scandals & Controversies</title>
  <style>
    :root {
      --bg:      #0d1117;
      --surface: #161b22;
      --border:  #30363d;
      --accent:  #c9a227;
      --red:     #da3633;
      --orange:  #e3693b;
      --green:   #3fb950;
      --blue:    #58a6ff;
      --text:    #e6edf3;
      --muted:   #8b949e;
      --radius:  8px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
    }

    /* ── Header ── */
    header {
      background: var(--surface);
      border-bottom: 2px solid var(--accent);
      padding: 1.25rem 2rem;
      display: flex;
      align-items: center;
      gap: 1rem;
    }
    .logo { font-size: 2rem; }
    header h1 { font-size: 1.4rem; font-weight: 700; color: var(--accent); }
    header p  { font-size: .85rem; color: var(--muted); margin-top: 3px; }

    #lang-btn {
      margin-left: auto;
      background: transparent;
      border: 1px solid var(--accent);
      color: var(--accent);
      font-size: .75rem;
      font-weight: 700;
      padding: .3rem .7rem;
      border-radius: 4px;
      cursor: pointer;
      letter-spacing: .05em;
      transition: all .15s;
      flex-shrink: 0;
    }
    #lang-btn:hover {
      background: rgba(201,162,39,.12);
    }

    #total-badge {
      background: var(--red);
      color: #fff;
      font-size: .75rem;
      font-weight: 700;
      padding: .3rem .75rem;
      border-radius: 999px;
      flex-shrink: 0;
    }

    /* ── Filters ── */
    .filters {
      padding: 1rem 2rem;
      display: flex;
      gap: .5rem;
      flex-wrap: wrap;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
    }
    .filter-btn {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--muted);
      padding: .35rem .9rem;
      border-radius: 999px;
      font-size: .8rem;
      cursor: pointer;
      transition: all .15s;
    }
    .filter-btn:hover, .filter-btn.active {
      border-color: var(--accent);
      color: var(--accent);
      background: rgba(201,162,39,.08);
    }

    /* ── Grid ── */
    main {
      padding: 1.75rem 2rem;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
      gap: 1.25rem;
    }

    /* ── Card ── */
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 1.25rem;
      display: flex;
      flex-direction: column;
      gap: .8rem;
      transition: border-color .15s, transform .15s;
    }
    .card:hover { border-color: var(--accent); transform: translateY(-2px); }

    .card-header { display: flex; justify-content: space-between; align-items: flex-start; gap: .5rem; }
    .card-header h2 { font-size: 1rem; font-weight: 600; line-height: 1.45; }

    /* Severity pills */
    .gravite {
      font-size: .68rem; font-weight: 700;
      padding: .2rem .55rem; border-radius: 999px;
      white-space: nowrap; flex-shrink: 0;
    }
    .gravite-haute   { background: rgba(218,54,51,.15);  color: var(--red);    border: 1px solid rgba(218,54,51,.4); }
    .gravite-moyenne { background: rgba(227,105,59,.15); color: var(--orange); border: 1px solid rgba(227,105,59,.4); }
    .gravite-basse   { background: rgba(63,185,80,.15);  color: var(--green);  border: 1px solid rgba(63,185,80,.4); }

    /* Meta row */
    .card-meta { display: flex; gap: .4rem; flex-wrap: wrap; font-size: .73rem; color: var(--muted); }
    .meta-pill { background: rgba(255,255,255,.05); border-radius: 4px; padding: .15rem .45rem; }

    .card p { font-size: .875rem; color: var(--muted); line-height: 1.65; }

    .card-tags { display: flex; flex-wrap: wrap; gap: .35rem; }
    .tag {
      font-size: .7rem; color: var(--accent);
      background: rgba(201,162,39,.1);
      border: 1px solid rgba(201,162,39,.2);
      border-radius: 4px; padding: .1rem .4rem;
    }

    .card-sources {
      font-size: .75rem;
      border-top: 1px solid var(--border);
      padding-top: .6rem; color: var(--muted);
    }
    .card-sources a { color: var(--blue); text-decoration: none; margin-right: .5rem; }
    .card-sources a:hover { text-decoration: underline; }

    /* ── Empty state ── */
    #empty {
      display: none;
      grid-column: 1/-1;
      text-align: center;
      padding: 3rem;
      color: var(--muted);
    }

    /* ── Footer ── */
    footer {
      text-align: center;
      padding: 1.5rem 2rem;
      font-size: .78rem;
      color: var(--muted);
      border-top: 1px solid var(--border);
    }
  </style>
</head>
<body>

<header>
  <span class="logo">⚽</span>
  <div>
    <h1>FIFA 2026 Watch</h1>
    <p id="header-subtitle"></p>
  </div>
  <button id="lang-btn"></button>
  <span id="total-badge">—</span>
</header>

<div class="filters" id="filters"></div>

<main id="grid"></main>
<p id="empty"></p>

<footer id="footer"></footer>

<script type="module">
  const I18N = {
    fr: {
      subtitle:  "Journalisme citoyen — Scandales & controverses de la Coupe du Monde 2026",
      all:       "Tous",
      cases:     "cas",
      sources:   "Sources :",
      empty:     "Aucun résultat pour ce filtre.",
      footer:    "Source : data/scandales.json — Projet open source, à but informatif uniquement.",
      langBtn:   "EN",
      sev:       { haute: "HAUTE", moyenne: "MOYENNE", basse: "BASSE" },
      cat: {
        securite:      "Sécurité",
        gouvernance:   "Gouvernance",
        visa:          "Visa",
        corruption:    "Corruption",
        droits:        "Droits",
        economie:      "Économie",
        environnement: "Environnement"
      }
    },
    en: {
      subtitle:  "Citizen journalism — Scandals & controversies at the 2026 FIFA World Cup",
      all:       "All",
      cases:     "cases",
      sources:   "Sources:",
      empty:     "No results for this filter.",
      footer:    "Source: data/scandales.json — Open source project, for informational purposes only.",
      langBtn:   "FR",
      sev:       { haute: "HIGH", moyenne: "MEDIUM", basse: "LOW" },
      cat: {
        securite:      "Security",
        gouvernance:   "Governance",
        visa:          "Visa",
        corruption:    "Corruption",
        droits:        "Rights",
        economie:      "Economics",
        environnement: "Environment"
      }
    }
  };

  const SEVERITE_LABEL = { 5: "haute", 4: "haute", 3: "moyenne", 2: "basse", 1: "basse" };

  let lang = localStorage.getItem('lang') ||
             (navigator.language.startsWith('fr') ? 'fr' : 'en');
  let scandales    = [];
  let currentFilter = null;

  function t(key) { return I18N[lang][key]; }

  function applyLang() {
    document.documentElement.lang = lang;
    document.getElementById('lang-btn').textContent        = t('langBtn');
    document.getElementById('header-subtitle').textContent = t('subtitle');
    document.getElementById('empty').textContent           = t('empty');
    document.getElementById('footer').textContent          = t('footer');
    document.getElementById('total-badge').textContent     = `${scandales.length} ${t('cases')}`;
    buildFilters();
    render(currentFilter);
  }

  function buildFilters() {
    const cats     = [...new Set(scandales.map(s => s.categorie))];
    const filtersEl = document.getElementById('filters');
    filtersEl.innerHTML = '';

    const allBtn = document.createElement('button');
    allBtn.className   = 'filter-btn' + (currentFilter === null ? ' active' : '');
    allBtn.textContent = t('all');
    allBtn.addEventListener('click', () => { currentFilter = null; buildFilters(); render(null); });
    filtersEl.appendChild(allBtn);

    cats.forEach(cat => {
      const btn = document.createElement('button');
      btn.className   = 'filter-btn' + (currentFilter === cat ? ' active' : '');
      btn.textContent = t('cat')[cat] ?? cat;
      btn.addEventListener('click', () => { currentFilter = cat; buildFilters(); render(cat); });
      filtersEl.appendChild(btn);
    });
  }

  function render(filter) {
    const items = filter === null ? scandales : scandales.filter(s => s.categorie === filter);
    const grid  = document.getElementById('grid');
    const empty = document.getElementById('empty');

    grid.innerHTML = '';
    empty.style.display = items.length ? 'none' : 'block';

    items.forEach(s => {
      const gravite = SEVERITE_LABEL[s.severite] ?? 'moyenne';
      const sevLabel = t('sev')[gravite];
      const pays    = Array.isArray(s.pays_concernes) ? s.pays_concernes : (s.pays ? [s.pays] : []);
      const titre   = (lang === 'fr' ? s.titre_fr : null) ?? s.titre;
      const corps   = (lang === 'fr' ? s.corps_fr : null) ?? s.corps ?? s.description ?? '';
      const el = document.createElement('div');
      el.className = 'card';
      el.innerHTML = `
        <div class="card-header">
          <h2>${titre}</h2>
          <span class="gravite gravite-${gravite}">${sevLabel}</span>
        </div>
        <div class="card-meta">
          <span class="meta-pill">📅 ${s.date}</span>
          <span class="meta-pill">🗂 ${t('cat')[s.categorie] ?? s.categorie}</span>
          ${pays.map(p => `<span class="meta-pill">🌍 ${p}</span>`).join('')}
        </div>
        <p>${corps}</p>
        <div class="card-tags">${(s.tags ?? []).map(t => `<span class="tag">#${t}</span>`).join('')}</div>
        <div class="card-sources">
          <strong>${I18N[lang].sources}</strong>
          ${s.sources.map(src => `<a href="${src.url}" target="_blank" rel="noopener">${src.label ?? src.titre}</a>`).join('')}
        </div>`;
      grid.appendChild(el);
    });
  }

  document.getElementById('lang-btn').addEventListener('click', () => {
    lang = lang === 'fr' ? 'en' : 'fr';
    localStorage.setItem('lang', lang);
    applyLang();
  });

  async function init() {
    const data = await fetch('data/scandales.json').then(r => r.json());
    scandales  = data.scandales;
    applyLang();
  }

  init().catch(e => {
    document.getElementById('grid').innerHTML =
      `<p style="color:var(--red);padding:2rem">Error: ${e.message}</p>`;
  });
</script>
</body>
</html>
