<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FIFA 2026 Watch — Scandales & Controverses</title>
  <style>
    :root {
      --bg:      #0d1117;
      --surface: #161b22;
      --border:  #30363d;
      --accent:  #c9a227;
      --red:     #da3633;
      --orange:  #e3693b;
      --green:   #3fb950;
      --blue:    #58a6ff;
      --text:    #e6edf3;
      --muted:   #8b949e;
      --radius:  8px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
    }

    /* ── Header ── */
    header {
      background: var(--surface);
      border-bottom: 2px solid var(--accent);
      padding: 1.25rem 2rem;
      display: flex;
      align-items: center;
      gap: 1rem;
    }
    .logo { font-size: 2rem; }
    header h1 { font-size: 1.4rem; font-weight: 700; color: var(--accent); }
    header p  { font-size: .85rem; color: var(--muted); margin-top: 3px; }
    #total-badge {
      margin-left: auto;
      background: var(--red);
      color: #fff;
      font-size: .75rem;
      font-weight: 700;
      padding: .3rem .75rem;
      border-radius: 999px;
    }

    /* ── Filters ── */
    .filters {
      padding: 1rem 2rem;
      display: flex;
      gap: .5rem;
      flex-wrap: wrap;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
    }
    .filter-btn {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--muted);
      padding: .35rem .9rem;
      border-radius: 999px;
      font-size: .8rem;
      cursor: pointer;
      transition: all .15s;
    }
    .filter-btn:hover, .filter-btn.active {
      border-color: var(--accent);
      color: var(--accent);
      background: rgba(201,162,39,.08);
    }

    /* ── Grid ── */
    main {
      padding: 1.75rem 2rem;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
      gap: 1.25rem;
    }

    /* ── Card ── */
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 1.25rem;
      display: flex;
      flex-direction: column;
      gap: .8rem;
      transition: border-color .15s, transform .15s;
    }
    .card:hover { border-color: var(--accent); transform: translateY(-2px); }

    .card-header { display: flex; justify-content: space-between; align-items: flex-start; gap: .5rem; }
    .card-header h2 { font-size: 1rem; font-weight: 600; line-height: 1.45; }

    /* Gravité pills */
    .gravite {
      font-size: .68rem; font-weight: 700;
      padding: .2rem .55rem; border-radius: 999px;
      white-space: nowrap; flex-shrink: 0;
    }
    .gravite-haute   { background: rgba(218,54,51,.15);  color: var(--red);    border: 1px solid rgba(218,54,51,.4); }
    .gravite-moyenne { background: rgba(227,105,59,.15); color: var(--orange); border: 1px solid rgba(227,105,59,.4); }
    .gravite-basse   { background: rgba(63,185,80,.15);  color: var(--green);  border: 1px solid rgba(63,185,80,.4); }

    /* Meta row */
    .card-meta { display: flex; gap: .4rem; flex-wrap: wrap; font-size: .73rem; color: var(--muted); }
    .meta-pill { background: rgba(255,255,255,.05); border-radius: 4px; padding: .15rem .45rem; }

    /* Statut color */
    .s-confirmé   { color: var(--red); }
    .s-vérifié    { color: var(--orange); }
    .s-allégation { color: var(--muted); }
    .s-en-cours   { color: var(--blue); }

    .card p { font-size: .875rem; color: var(--muted); line-height: 1.65; }

    .card-tags { display: flex; flex-wrap: wrap; gap: .35rem; }
    .tag {
      font-size: .7rem; color: var(--accent);
      background: rgba(201,162,39,.1);
      border: 1px solid rgba(201,162,39,.2);
      border-radius: 4px; padding: .1rem .4rem;
    }

    .card-sources {
      font-size: .75rem;
      border-top: 1px solid var(--border);
      padding-top: .6rem; color: var(--muted);
    }
    .card-sources a { color: var(--blue); text-decoration: none; margin-right: .5rem; }
    .card-sources a:hover { text-decoration: underline; }

    /* ── Empty state ── */
    #empty {
      display: none;
      grid-column: 1/-1;
      text-align: center;
      padding: 3rem;
      color: var(--muted);
    }

    /* ── Footer ── */
    footer {
      text-align: center;
      padding: 1.5rem 2rem;
      font-size: .78rem;
      color: var(--muted);
      border-top: 1px solid var(--border);
    }
  </style>
</head>
<body>

<header>
  <span class="logo">⚽</span>
  <div>
    <h1>FIFA 2026 Watch</h1>
    <p>Journalisme citoyen — Scandales &amp; controverses de la Coupe du Monde 2026</p>
  </div>
  <span id="total-badge">— cas</span>
</header>

<div class="filters" id="filters"></div>

<main id="grid"></main>
<p id="empty">Aucun résultat pour ce filtre.</p>

<footer>
  Source : <code>data/scandales.json</code> &mdash; Projet open source, à but informatif uniquement.
</footer>

<script type="module">
  const STATUT_CLS = {
    "confirmé":   "s-confirmé",
    "vérifié":    "s-vérifié",
    "allégation": "s-allégation",
    "en cours":   "s-en-cours",
  };

  async function init() {
    const { scandales } = await fetch("data/scandales.json").then(r => r.json());

    document.getElementById("total-badge").textContent = `${scandales.length} cas`;

    // Build filters
    const cats = ["Tous", ...new Set(scandales.map(s => s.categorie))];
    const filtersEl = document.getElementById("filters");
    cats.forEach(cat => {
      const btn = document.createElement("button");
      btn.className = "filter-btn" + (cat === "Tous" ? " active" : "");
      btn.textContent = cat;
      btn.addEventListener("click", () => {
        filtersEl.querySelectorAll(".filter-btn").forEach(b => b.classList.remove("active"));
        btn.classList.add("active");
        render(scandales, cat);
      });
      filtersEl.appendChild(btn);
    });

    render(scandales, "Tous");
  }

  const SEVERITE_LABEL = { 5: "haute", 4: "haute", 3: "moyenne", 2: "basse", 1: "basse" };

  function render(all, filter) {
    const items = filter === "Tous" ? all : all.filter(s => s.categorie === filter);
    const grid  = document.getElementById("grid");
    const empty = document.getElementById("empty");

    grid.innerHTML = "";
    empty.style.display = items.length ? "none" : "block";

    items.forEach(s => {
      const gravite = SEVERITE_LABEL[s.severite] ?? "moyenne";
      const pays = Array.isArray(s.pays_concernes) ? s.pays_concernes : (s.pays ? [s.pays] : []);
      const el = document.createElement("div");
      el.className = "card";
      el.innerHTML = `
        <div class="card-header">
          <h2>${s.titre}</h2>
          <span class="gravite gravite-${gravite}">${gravite.toUpperCase()}</span>
        </div>
        <div class="card-meta">
          <span class="meta-pill">📅 ${s.date}</span>
          <span class="meta-pill">🗂 ${s.categorie}</span>
          ${pays.map(p => `<span class="meta-pill">🌍 ${p}</span>`).join("")}
        </div>
        <p>${s.corps ?? s.description ?? ""}</p>
        <div class="card-tags">${(s.tags ?? []).map(t => `<span class="tag">#${t}</span>`).join("")}</div>
        <div class="card-sources">
          <strong>Sources :</strong>
          ${s.sources.map(src => `<a href="${src.url}" target="_blank" rel="noopener">${src.label ?? src.titre}</a>`).join("")}
        </div>`;
      grid.appendChild(el);
    });
  }

  init().catch(e => {
    document.getElementById("grid").innerHTML =
      `<p style="color:var(--red);padding:2rem">Erreur : ${e.message}</p>`;
  });
</script>
</body>
</html>
